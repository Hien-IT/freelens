[package]
name = "freelens-tauri"
version = "0.1.0"
description = "Experimental Tauri build of Freelens (spike)"
license = "MIT"
edition = "2024"
rust-version = "1.95"
publish = false

[lib]
name = "freelens_tauri"

[[bin]]
name = "freelens-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
http = "1"
k8s-openapi = { version = "0.29.0", features = ["v1_37"] }
kube = "5.1.0"
md-5 = "0.11.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.7", features = [] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
