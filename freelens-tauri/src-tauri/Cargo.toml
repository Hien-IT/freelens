[package]
name = "freelens-tauri"
version = "0.1.0"
description = "Experimental Tauri build of Freelens (spike)"
license = "MIT"
edition = "2024"
rust-version = "1.95"
publish = false

[lib]
name = "freelens_tauri"

[[bin]]
name = "freelens-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
http = "1"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
iana-time-zone = "0.1.65"
k8s-openapi = { version = "0.29.0", features = ["v1_37"] }
kube = { version = "5.1.0", features = ["http-proxy", "oidc", "socks5"] }
libc = "0.2.191"
md-5 = "0.11.0"
notify = "9.0.0"
rustls = { version = "0.23.46", default-features = false, features = [
  "logging",
  "ring",
  "std",
  "tls12",
] }
rustls-platform-verifier = "0.7.1"
serde = { version = "1", features = ["derive"] }
serde-saphyr = "2.2.0"
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
sha2 = "0.10.9"
tauri = { version = "2.12.7", features = [] }
tokio = { version = "1.54.1", features = [
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "sync",
  "time",
] }
tokio-rustls = { version = "0.26.6", default-features = false, features = [
  "logging",
  "ring",
  "tls12",
] }
url = "2.5.9"
uuid = { version = "1.29.3", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "NSObject",
  "NSProcessInfo",
  "NSString",
  "std",
] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
